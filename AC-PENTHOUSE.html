<script>
  const progress = document.getElementById("progress");
  const progressText = document.getElementById("progress-text");

  function animateProgress() {
    let current = 0;
    const target = 10;
    const duration = 1000;
    const resetDelay = 10000;
    const intervalTime = 50;
    const step = target / (duration / intervalTime);

    progress.style.opacity = 1;

    const interval = setInterval(() => {
      current += step;

      if (current >= target) {
        current = target;
        clearInterval(interval);

        setTimeout(() => {
          progress.style.opacity = 0;

          setTimeout(() => {
            progress.style.width = "0%";
            progressText.textContent = "0%";
            progressText.style.left = "10px";

            setTimeout(animateProgress, 800);
          }, 800);
        }, resetDelay);
      }

      const percentage = Math.round(current);

      progress.style.width = percentage + "%";
      progressText.textContent = percentage + "%";

      // Better text positioning
      const wrapperWidth =
        document.querySelector(".progress-wrapper").offsetWidth;

      const textWidth = progressText.offsetWidth;

      let leftPos =
        (wrapperWidth * percentage) / 100 - textWidth / 2;

      leftPos = Math.max(10, leftPos);
      leftPos = Math.min(wrapperWidth - textWidth - 10, leftPos);

      progressText.style.left = leftPos + "px";
    }, intervalTime);
  }

  window.addEventListener("load", animateProgress);
</script>
